# ════════════════════════════════════════════════════════════
# 🌌  3D CONTRIBUTION GALAXY — GitHub Actions Workflow
# Generates an animated 3D pixel-art contribution calendar
# with seasonal themes and walking pixel characters.
#
# ✅ FIXED: Correct action owner is yoshi389111 (not yoshi-code-bot)
# ✅ FIXED: Uses USERNAME env var (not `with: username`)
# ✅ FIXED: Commits generated SVGs directly to `main` branch
#
# Runs every 24 hours + on manual trigger.
# Output: profile-3d-contrib/ folder committed to main branch.
# Reference in README as:
#   https://raw.githubusercontent.com/achyutp10/achyutp10/main/profile-3d-contrib/profile-south-season-animate.svg
# ════════════════════════════════════════════════════════════

name: Generate 3D Contribution Calendar 🌌

on:
  schedule:
    # Runs daily at 18:00 UTC (03:00 JST next day)
    - cron: "0 18 * * *"
  workflow_dispatch:   # ← Allows manual trigger from the Actions tab

permissions:
  contents: write      # ← Required to commit & push the generated SVGs

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib

    steps:
      # ── Step 1: Checkout ──────────────────────────────────
      - uses: actions/checkout@v5

      # ── Step 2: Generate all 3D SVG variants ─────────────
      # Correct action: yoshi389111/github-profile-3d-contrib
      # USERNAME is passed as an env var, NOT as `with: username`
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}   # auto-resolves to achyutp10

      # ── Step 3: Commit & push the SVGs to main ───────────
      # SVGs are written into profile-3d-contrib/ in the workspace.
      # This step commits them back to the main branch.
      - name: Commit & Push generated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git commit -m "🌌 Auto-update 3D Contribution Calendar [skip ci]"; then
            git push
          else
            echo "Nothing to commit — SVGs unchanged."
          fi
