# ════════════════════════════════════════════════════════════
# 🐍  CONTRIBUTION SNAKE — GitHub Actions Workflow
#
# ✅ FIXED: Replaced JamesIves deploy action (needs checkout)
#           with crazy-max/ghaction-github-pages (handles its
#           own git init — the official Platane/snk approach)
#
# Generates animated snake SVGs and pushes to `output` branch.
# README references:
#   https://raw.githubusercontent.com/achyutp10/achyutp10/output/github-contribution-grid-snake-dark.svg
# ════════════════════════════════════════════════════════════

name: Generate Contribution Snake 🐍

on:
  schedule:
    # Runs every 12 hours at 6am and 6pm UTC
    - cron: "0 6,18 * * *"
  workflow_dispatch:   # ← Manual trigger from Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate Contribution Snake Animation
    permissions:
      contents: write

    steps:
      # ── Step 1: Generate both light + dark SVGs into dist/ ─
      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: achyutp10
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 2: Push dist/ to the `output` branch ─────────
      # crazy-max/ghaction-github-pages handles git init itself.
      # No prior `actions/checkout` needed.
      # keep_history: true ensures the 3D calendar files already
      # on the output branch are NOT deleted.
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
