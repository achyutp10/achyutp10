# ════════════════════════════════════════════════════════════
# 🐍  CONTRIBUTION SNAKE — GitHub Actions Workflow
# Generates an animated snake eating through your
# GitHub contribution grid. Updates every 12 hours.
# Creates both light + dark mode SVG variants.
# Output: root of the `output` branch
# ════════════════════════════════════════════════════════════

name: Generate Contribution Snake 🐍

on:
  schedule:
    # Runs every 12 hours at 6am and 6pm UTC
    - cron: "0 6,18 * * *"
  workflow_dispatch:     # Allow manual trigger from Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate Contribution Snake Animation
    permissions:
      contents: write

    steps:
      # ── Step 1: Generate snake SVG animations ────────────
      # Generates two files in ./dist/:
      # - github-contribution-grid-snake.svg        (light mode)
      # - github-contribution-grid-snake-dark.svg   (dark mode)
      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user: achyutp10
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 2: Deploy snake SVGs to `output` branch ─────
      - name: Deploy to Output Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
          target-folder: .           # Snake files go to root of output
          clean: false               # ← Important: don't delete 3D files
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🐍 Auto-update Contribution Snake [skip ci]"
